name: Build Application

on:
  pull_request:
    branches: [main, 'refactor/**', 'redesign/**']
    paths:
      - 'application-source/**'
      - '.github/workflows/build_application.yml'
      - 'LICENSE'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Git branch, tag, or full commit SHA to build (use a SHA for exact verification)'
        required: true
        default: 'main'
        type: string
      release_tag:
        description: 'Optional existing release tag that must resolve to the built commit'
        required: false
        type: string

# Keep only the newest run for this PR/ref. Rapid successive commits should
# not consume runners validating obsolete heads.
concurrency:
  group: build-application-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }} application
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: OpenVLC-v3-Linux-x64
          - os: windows-latest
            artifact_name: OpenVLC-v3-Windows-x64

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && format('refs/tags/{0}', github.event.release.tag_name) || inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Record Checked-Out Source
        id: source
        shell: bash
        run: |
          source_sha=$(git rev-parse HEAD)
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'Checked-out source commit: `%s`\n' "$source_sha" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0 \
            libxcb-xfixes0 libxcb-shape0 libxcb-randr0 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-icccm4 \
            libxcb-sync1 libx11-xcb1 libxrender1 libegl1 xvfb

      - name: Install Python Dependencies
        working-directory: application-source
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Run Hardware and Protocol Unit Tests
        working-directory: application-source
        run: python -m pytest tests -q

      - name: Run Application Source Smoke Test
        working-directory: application-source
        timeout-minutes: 2
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run python run_v3.py --smoke-test
          else
            python run_v3.py --smoke-test
          fi
        shell: bash

      - name: Capture Responsive UI Screenshots (100%, 125%, 150%)
        working-directory: application-source
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          for scale in 1.0 1.25 1.5; do
            if [ "$RUNNER_OS" = "Linux" ]; then
              QT_SCALE_FACTOR="$scale" OPENVLC_SCREENSHOT_SCALE="$scale" xvfb-run python tests/capture_ui_screenshots.py
            else
              QT_SCALE_FACTOR="$scale" OPENVLC_SCREENSHOT_SCALE="$scale" python tests/capture_ui_screenshots.py
            fi
          done
        shell: bash

      - name: Upload UI Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: OpenVLC-UI-Screenshots-${{ matrix.os }}
          path: application-source/ui-screenshots/**/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Build Application
        working-directory: application-source
        env:
          QT_QPA_PLATFORM: offscreen
        run: pyinstaller OpenVLC-v3.spec --clean

      - name: Run Packaged Application Smoke Test (Linux)
        if: runner.os == 'Linux'
        working-directory: application-source
        timeout-minutes: 2
        env:
          QT_DEBUG_PLUGINS: '1'
        run: |
          if ! xvfb-run ./dist/OpenVLC-v3/OpenVLC-v3 --smoke-test 2> smoke_test_err.log; then
            cat smoke_test_err.log
            exit 1
          fi

      - name: Run Packaged Application Smoke Test (Windows)
        if: runner.os == 'Windows'
        working-directory: application-source
        timeout-minutes: 2
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\OpenVLC-v3\OpenVLC-v3.exe" -ArgumentList "--smoke-test" -PassThru -Wait -RedirectStandardError "smoke_test_err.log"
          if ($process.ExitCode -ne 0) {
            Get-Content smoke_test_err.log
            Write-Error "Packaged application exited with code $($process.ExitCode)"
            exit 1
          }
          if (Select-String -Path "smoke_test_err.log" -Pattern "Could not find the Qt platform plugin" -Quiet) {
            Get-Content smoke_test_err.log
            Write-Error "Qt platform plugin error detected"
            exit 1
          }

      - name: Verify Packaged Files and Record Build Commit
        shell: bash
        env:
          BUILD_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          bundle=application-source/dist/OpenVLC-v3
          font_assets=application-source/gui_dev_v3/assets/fonts
          cmp LICENSE "$bundle/_internal/LICENSE"
          cmp application-source/THIRD_PARTY_NOTICES.md "$bundle/_internal/THIRD_PARTY_NOTICES.md"
          for font in "$font_assets"/*-Regular.ttf; do
            test -f "${font%-Regular.ttf}-OFL.txt"
          done
          for asset in "$font_assets"/*; do
            cmp "$asset" "$bundle/_internal/gui_dev_v3/assets/fonts/${asset##*/}"
          done
          diff -r application-source/third-party-licenses "$bundle/_internal/third_party_licenses/upstream"
          cp LICENSE "$bundle/LICENSE"
          printf '%s\n' "$BUILD_COMMIT" > "$bundle/BUILD_COMMIT.txt"

      - name: Package Linux Build
        if: runner.os == 'Linux'
        working-directory: application-source
        run: zip -r ../${{ matrix.artifact_name }}.zip dist/OpenVLC-v3

      - name: Package Windows Build
        if: runner.os == 'Windows'
        working-directory: application-source
        shell: pwsh
        run: Compress-Archive -Path dist/OpenVLC-v3 -DestinationPath ../${{ matrix.artifact_name }}.zip -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
          if-no-files-found: error

  release:
    name: Publish Windows and Linux Builds to Release
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: OpenVLC-v3-*-x64
          merge-multiple: true

      - name: Resolve Selected Release Tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.release_tag }}
          path: release-source
          persist-credentials: false

      - name: Confirm Build Commits Match Tag and Upload Builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          test -n "$VERSION_TAG"
          release_sha=$(git -C release-source rev-parse 'HEAD^{commit}')
          python3 - "$release_sha" <<'PY'
          import sys
          from zipfile import ZipFile

          release_sha = sys.argv[1]
          for platform, bundle in (("Linux", "dist/OpenVLC-v3"), ("Windows", "OpenVLC-v3")):
              filename = f"release-assets/OpenVLC-v3-{platform}-x64.zip"
              with ZipFile(filename) as archive:
                  build_sha = archive.read(f"{bundle}/BUILD_COMMIT.txt").decode("ascii").strip()
              if build_sha != release_sha:
                  raise SystemExit(f"{filename} was built at {build_sha}; release tag resolves to {release_sha}")
              print(f"{filename} matches release commit {release_sha}")
          PY
          gh release view --repo "$GITHUB_REPOSITORY" -- "$VERSION_TAG"
          gh release upload --repo "$GITHUB_REPOSITORY" --clobber -- "$VERSION_TAG" \
            release-assets/OpenVLC-v3-Windows-x64.zip \
            release-assets/OpenVLC-v3-Linux-x64.zip
